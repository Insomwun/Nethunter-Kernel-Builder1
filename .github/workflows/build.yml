name: "Build kernels"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Set-repos:
    name: "🐂 Parse repos.json"
    runs-on: ubuntu-latest

    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}

    steps:
      - name: "😄 Checkout"
        uses: actions/checkout@v4

      - name: "✅ Validate repos.json"
        run: |
          jq empty "${CONFIGURATION}"
          jq -e 'type == "array" and length > 0' "${CONFIGURATION}" >/dev/null

      - name: "😆 Generate Matrix"
        id: generate-matrix
        shell: bash
        run: |
          {
            echo "repos<<EOF"
            cat "${CONFIGURATION}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  Build-Kernel:
    name: "🐎 Build kernel"
    runs-on: ubuntu-latest
    needs: Set-repos

    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}

    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.device }}_defconfig
      withKernelSU: ${{ matrix.repos.withKernelSU }}
      ARCH: ${{ matrix.repos.params.ARCH }}

    steps:
      - name: "✨ Create working directory"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${kernelDir}"

      - name: "⭐ Install prerequisites"
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            build-essential \
            bison \
            ccache \
            curl \
            flex \
            ftp \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libarchive-tools \
            libelf-dev \
            libfl-dev \
            libssl-dev \
            lftp \
            python3 \
            rsync \
            wget \
            zip \
            zstd

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --recursive \
            --depth=1 \
            --branch "${kernelBranch}" \
            "${kernelRepo}" \
            "${kernelName}"

      - name: "💫 Get toolchains"
        working-directory: ./${{ env.kernelDir }}
        env:
          TOOLCHAINS: ${{ toJSON(matrix.repos.toolchains) }}
        shell: bash
        run: |
          set -euo pipefail

          toolchains_num="$(jq -r 'length' <<< "${TOOLCHAINS}")"

          for ((i = 0; i < toolchains_num; i++)); do
            name="$(jq -r ".[$i].name" <<< "${TOOLCHAINS}")"
            repo="$(jq -r ".[$i].repo" <<< "${TOOLCHAINS}")"
            branch="$(jq -r ".[$i].branch" <<< "${TOOLCHAINS}")"

            if [[ -z "${name}" || "${name}" == "null" ]]; then
              echo "Toolchain name is missing."
              exit 1
            fi

            if [[ -z "${repo}" || "${repo}" == "null" ]]; then
              echo "Toolchain repository is missing."
              exit 1
            fi

            git clone \
              --recursive \
              --depth=1 \
              --branch "${branch}" \
              "${repo}" \
              "${name}"

            toolchain_root="${PWD}/${name}"

            if [[ -d "${toolchain_root}/bin" ]]; then
              echo "${toolchain_root}/bin" >> "${GITHUB_PATH}"
            fi

            echo "${toolchain_root}" >> "${GITHUB_PATH}"
          done

      - name: "🔎 Check compiler toolchain"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          PARAMS: ${{ toJSON(matrix.repos.params) }}
        shell: bash
        run: |
          set -euo pipefail

          cc="$(jq -r '.CC // ""' <<< "${PARAMS}")"
          cross_compile="$(jq -r '.CROSS_COMPILE // ""' <<< "${PARAMS}")"

          if [[ -n "${cc}" ]]; then
            command -v "${cc}" || {
              echo "Compiler '${cc}' was not found in PATH."
              exit 1
            }
          fi

          if [[ -n "${cross_compile}" ]]; then
            command -v "${cross_compile}gcc" || {
              echo "Cross compiler '${cross_compile}gcc' was not found in PATH."
              exit 1
            }
          fi

          echo "Compiler checks passed."
          echo "PATH=${PATH}"

      - name: "😎 Set build arguments"
        id: generate-args
        working-directory: ./${{ env.kernelDir }}
        env:
          PARAMS: ${{ toJSON(matrix.repos.params) }}
          EXTRA_PARAMS: ${{ toJSON(matrix.repos.extraParams) }}
        shell: bash
        run: |
          set -euo pipefail

          args=(-j"$(nproc --all)")

          if [[ -n "${OUT_DIR}" ]]; then
            mkdir -p "${PWD}/${OUT_DIR}"
            args+=("O=${PWD}/${OUT_DIR}")
          fi

          ARCH="$(jq -r '.ARCH // ""' <<< "${PARAMS}")"
          CROSS_COMPILE="$(jq -r '.CROSS_COMPILE // ""' <<< "${PARAMS}")"
          CROSS_COMPILE_COMPAT="$(jq -r '.CROSS_COMPILE_COMPAT // .CROSS_COMPILE_ARM32 // ""' <<< "${PARAMS}")"
          CLANG_TRIPLE="$(jq -r '.CLANG_TRIPLE // ""' <<< "${PARAMS}")"
          AR="$(jq -r '.AR // ""' <<< "${PARAMS}")"
          CC="$(jq -r '.CC // ""' <<< "${PARAMS}")"

          [[ -n "${ARCH}" ]] && args+=("ARCH=${ARCH}")
          [[ -n "${CROSS_COMPILE}" ]] && args+=("CROSS_COMPILE=${CROSS_COMPILE}")
          [[ -n "${CROSS_COMPILE_COMPAT}" ]] && args+=("CROSS_COMPILE_ARM32=${CROSS_COMPILE_COMPAT}")
          [[ -n "${CLANG_TRIPLE}" ]] && args+=("CLANG_TRIPLE=${CLANG_TRIPLE}")
          [[ -n "${AR}" ]] && args+=("AR=${AR}")
          [[ -n "${CC}" ]] && args+=("CC=${CC}")

          extra_params=()

          if [[ "${EXTRA_PARAMS}" != "null" && -n "${EXTRA_PARAMS}" ]]; then
            while IFS= read -r param; do
              [[ -n "${param}" ]] && extra_params+=("${param}")
            done < <(
              jq -r '
                (. // {})
                | to_entries[]
                | select(.value != null and .value != "")
                | "\(.key)=\(.value)"
              ' <<< "${EXTRA_PARAMS}"
            )
          fi

          args+=("${extra_params[@]}")

          printf -v args_string '%q ' "${args[@]}"
          args_string="${args_string%

